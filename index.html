<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yezhuththu.site | Web Development Agency</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      line-height: 1.6;
      padding: 40px 20px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      color: #0f172a;
      margin-bottom: 30px;
    }

    h2 {
      text-align: center;
      font-size: 1.6rem;
      color: #1e293b;
      margin-bottom: 20px;
    }

    /* Package Cards Layout */
    .packages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 50px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .card .price {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 16px;
    }

    .card ul {
      list-style: none;
      margin-top: auto;
    }

    .card ul li {
      font-size: 0.95rem;
      color: #64748b;
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }

    .card ul li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #10b981;
      font-weight: bold;
    }

    /* Instant Quote Form */
    form {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #e2e8f0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      color: #1e293b;
      background-color: #f8fafc;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2563eb;
      background-color: #ffffff;
    }

    button {
      width: 100%;
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    /* Response Message */
    #statusMessage {
      text-align: center;
      margin-top: 16px;
      font-size: 0.95rem;
      display: none;
    }

    #statusMessage.success {
      color: #16a34a;
    }

    #statusMessage.error {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Website Development Services</h1>

    <div class="packages">
      <div class="card">
        <h3>Static Website</h3>
        <div class="price">₹6,000</div>
        <ul>
          <li>Up to 5 Pages</li>
          <li>Mobile Responsive</li>
        </ul>
      </div>

      <div class="card">
        <h3>Dynamic Website</h3>
        <div class="price">₹15,000</div>
        <ul>
          <li>Admin Panel (CMS)</li>
          <li>Unlimited Pages</li>
        </ul>
      </div>

      <div class="card">
        <h3>Ecommerce Website</h3>
        <div class="price">₹25,000</div>
        <ul>
          <li>Payment Gateway Integration</li>
          <li>Product Management</li>
        </ul>
      </div>
    </div>

    <h2>Get an Instant Quote</h2>
    <form id="leadForm">
      <div class="form-group">
        <label for="clientName">Full Name</label>
        <input type="text" id="clientName" placeholder="Swathi" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="example@domain.com" required />
      </div>

      <div class="form-group">
        <label for="serviceType">Service Required</label>
        <select id="serviceType" required>
          <option value="Static Website">Static Website (₹6,000)</option>
          <option value="Dynamic Website">Dynamic Website (₹15,000)</option>
          <option value="Ecommerce Website">Ecommerce Store (₹25,000)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="estimatedBudget">Estimated Budget (₹)</label>
        <input type="number" id="estimatedBudget" placeholder="5000" required />
      </div>

      <button type="submit" id="submitBtn">Submit Request</button>
      <div id="statusMessage"></div>
    </form>
  </div>

  <script>
    document.getElementById('leadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';
      statusMessage.style.display = 'none';

      // JSON payload aligned with Lead entity properties
      const payload = {
        clientname: document.getElementById('clientName').value,
        email: document.getElementById('email').value,
        serviceType: document.getElementById('serviceType').value,
        estimatedBudget: parseFloat(document.getElementById('estimatedBudget').value)
      };

      try {
        const response = await fetch('https://agency-backend-t8oq.onrender.com/api/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          statusMessage.className = 'success';
          statusMessage.innerText = 'Lead submitted successfully!';
          statusMessage.style.display = 'block';
          document.getElementById('leadForm').reset();
        } else {
          statusMessage.className = 'error';
          statusMessage.innerText = 'Submission failed with status: ' + response.status;
          statusMessage.style.display = 'block';
        }
      } catch (err) {
        console.error('Submission Error:', err);
        statusMessage.className = 'error';
        statusMessage.innerText = 'Network error. Please try again later.';
        statusMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Request';
      }
    });
  </script>
</body>
</html>
