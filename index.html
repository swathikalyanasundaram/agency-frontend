<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foci Studio — Design. Develop. Grow.</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Central Content Area with Smooth Professional Reveal */
    .central-content {
      position: absolute;
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: auto;
      animation: contentReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .main-title {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      color: #ffffff;
      line-height: 1.05;
    }

    .subtitle {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .contact-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.65rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }

    .contact-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1);
    }

    /* Orbital Stage with Pro Motion Physics */
    .orbit-stage {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotateOrbit 50s linear infinite;
    }

    .orbit-stage:hover {
      animation-play-state: paused;
    }

    /* High-End Glassmorphic Card Styling */
    .card {
      position: absolute;
      width: 150px;
      height: 150px;
      background: #0f0f11;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      animation: counterRotate 50s linear infinite, floatCard 6s ease-in-out infinite;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    .card:hover {
      transform: scale(1.12) !important;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      z-index: 20;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.05);
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.0);
    }

    /* Precision Trigonometric Layout Coordinates (Radius = 440px) */
    .card:nth-child(1) { transform: translate(440px, 0px); animation-delay: 0s, 0s; }
    .card:nth-child(2) { transform: translate(311px, 311px); animation-delay: 0s, 0.8s; }
    .card:nth-child(3) { transform: translate(0px, 440px); animation-delay: 0s, 1.6s; }
    .card:nth-child(4) { transform: translate(-311px, 311px); animation-delay: 0s, 2.4s; }
    .card:nth-child(5) { transform: translate(-440px, 0px); animation-delay: 0s, 3.2s; }
    .card:nth-child(6) { transform: translate(-311px, -311px); animation-delay: 0s, 4.0s; }
    .card:nth-child(7) { transform: translate(0px, -440px); animation-delay: 0s, 4.8s; }
    .card:nth-child(8) { transform: translate(311px, -311px); animation-delay: 0s, 5.6s; }

    /* Keyframe Motion Choreography */
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes counterRotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes floatCard {
      0%, 100% { margin-top: 0px; }
      50% { margin-top: -12px; }
    }

    @keyframes contentReveal {
      0% { opacity: 0; transform: translateY(20px) scale(0.98); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Responsive Adaptation for Smaller Viewports */
    @media (max-width: 1200px) {
      .card { width: 115px; height: 115px; border-radius: 16px; }
      .card:nth-child(1) { transform: translate(300px, 0px); }
      .card:nth-child(2) { transform: translate(212px, 212px); }
      .card:nth-child(3) { transform: translate(0px, 300px); }
      .card:nth-child(4) { transform: translate(-212px, 212px); }
      .card:nth-child(5) { transform: translate(-300px, 0px); }
      .card:nth-child(6) { transform: translate(-212px, -212px); }
      .card:nth-child(7) { transform: translate(0px, -300px); }
      .card:nth-child(8) { transform: translate(212px, -212px); }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    
    <!-- Pro Orbital Stage -->
    <div class="orbit-stage">
      <div class="card"><img src="https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?auto=format&fit=crop&w=500&q=80" alt="Work 1"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=500&q=80" alt="Work 2"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=80" alt="Work 3"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=500&q=80" alt="Work 4"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=500&q=80" alt="Work 5"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=500&q=80" alt="Work 6"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=500&q=80" alt="Work 7"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=500&q=80" alt="Work 8"></div>
    </div>

    <!-- Cinematic Center Stage Content -->
    <div class="central-content">
      <h1 class="main-title">Design. Develop. Grow.</h1>
      <p class="subtitle">Foci Studio - Design that means business.</p>
      <a href="#contact" class="contact-btn">Get in touch</a>
    </div>

  </div>

</body>
</html>
