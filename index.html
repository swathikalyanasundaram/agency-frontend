<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yezhuththu.site — Motion Design & Animation Studio</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-blue: #0070f3;
      --accent-teal: #00e599;
      --dark-teal: #00a86b;
      --white: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-blue);
      color: var(--white);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Header Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 5vw;
      width: 100%;
      z-index: 10;
    }

    .logo {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-btn {
      background: var(--white);
      color: var(--bg-blue);
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.2s ease;
    }

    .nav-btn:hover {
      transform: scale(1.05);
    }

    /* Main Motion Stage */
    .motion-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      width: 100%;
    }

    /* Background Sparkles & Accents */
    .sparkle {
      position: absolute;
      background: var(--white);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: twinkle 3s infinite ease-in-out alternate;
    }
    .s1 { width: 24px; height: 24px; top: 15%; right: 15%; }
    .s2 { width: 18px; height: 18px; bottom: 20%; left: 10%; animation-delay: 1.5s; }

    @keyframes twinkle {
      0% { transform: scale(0.8) rotate(0deg); opacity: 0.6; }
      100% { transform: scale(1.2) rotate(15deg); opacity: 1; }
    }

    /* Central Portal Ring */
    .portal-ring {
      position: absolute;
      width: 320px;
      height: 320px;
      border: 35px solid var(--accent-teal);
      border-radius: 50%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2), inset 0 10px 20px rgba(0,0,0,0.1);
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portal-inner-glow {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.2);
    }

    /* Scrolling Workflow Track */
    .workflow-track {
      position: absolute;
      display: flex;
      gap: 40px;
      width: max-content;
      z-index: 2;
      align-items: center;
    }

    /* Mockup Browser Window Cards */
    .browser-card {
      width: 300px;
      height: 190px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 2px solid rgba(255,255,255,0.4);
    }

    .browser-header {
      background: #e2e8f0;
      padding: 8px 12px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .browser-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .mock-image {
      width: 100%;
      height: 70px;
      background: linear-gradient(135deg, #a78bfa, #f43f5e);
      border-radius: 6px;
    }

    .mock-line {
      height: 10px;
      background: #cbd5e1;
      border-radius: 4px;
      width: 80%;
    }
    .mock-line.short { width: 45%; }

    /* Floating Interactive Console / Gadget */
    .console-gadget {
      position: absolute;
      bottom: 10%;
      right: 32%;
      width: 140px;
      height: 90px;
      background: #1e1b4b;
      border: 3px solid var(--accent-teal);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .console-badge {
      background: #ec4899;
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .console-text {
      font-size: 0.65rem;
      color: #94a3b8;
      text-align: center;
      font-weight: 600;
    }

    /* Footer Branding info */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0.8;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">yezhuththu.site</a>
    <a href="#contact" class="nav-btn">Start Project</a>
  </header>

  <div class="motion-stage">
    <!-- Sparkles -->
    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>

    <!-- Center Portal Ring -->
    <div class="portal-ring">
      <div class="portal-inner-glow"></div>
    </div>

    <!-- Floating Interactive Console Box -->
    <div class="console-gadget" id="consoleGadget">
      <div class="console-badge">✨ Add</div>
      <div class="console-text">Motion Design &amp; Animation</div>
    </div>

    <!-- Moving Workflow Conveyor Track -->
    <div class="workflow-track" id="workflowTrack">
      <!-- Card 1 -->
      <div class="browser-card">
        <div class="browser-header"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="browser-body"><div class="mock-image" style="background: linear-gradient(135deg, #38bdf8, #818cf8);"></div><div class="mock-line"></div><div class="mock-line short"></div></div>
      </div>
      <!-- Card 2 -->
      <div class="browser-card">
        <div class="browser-header"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="browser-body"><div class="mock-image" style="background: linear-gradient(135deg, #f43f5e, #fb923c);"></div><div class="mock-line"></div><div class="mock-line short"></div></div>
      </div>
      <!-- Card 3 -->
      <div class="browser-card">
        <div class="browser-header"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="browser-body"><div class="mock-image" style="background: linear-gradient(135deg, #10b981, #3b82f6);"></div><div class="mock-line"></div><div class="mock-line short"></div></div>
      </div>
      <!-- Card 4 -->
      <div class="browser-card">
        <div class="browser-header"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="browser-body"><div class="mock-image" style="background: linear-gradient(135deg, #a855f7, #ec4899);"></div><div class="mock-line"></div><div class="mock-line short"></div></div>
      </div>
      <!-- Card 5 -->
      <div class="browser-card">
        <div class="browser-header"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
        <div class="browser-body"><div class="mock-image" style="background: linear-gradient(135deg, #eab308, #ef4444);"></div><div class="mock-line"></div><div class="mock-line short"></div></div>
      </div>
    </div>
  </div>

  <footer>
    <p>yezhuththu.site — Motion Web Engineering Studio</p>
  </footer>

  <!-- Animation Loop Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Continuous Infinite Conveyor Belt Scrolling Animation using GSAP
      const track = document.getElementById("workflowTrack");
      
      // Animate track sliding horizontally infinitely
      gsap.to(track, {
        x: "-50%",
        duration: 16,
        ease: "none",
        repeat: -1
      });

      // Gentle floating animation for the console badge gadget
      gsap.to("#consoleGadget", {
        y: -12,
        duration: 2,
        ease: "sine.inOut",
        repeat: -1,
        yoyo: true
      });

      // Portal ring subtle rotation
      gsap.to(".portal-ring", {
        rotation: 360,
        duration: 25,
        ease: "none",
        repeat: -1
      });
    });
  </script>

</body>
</html>
