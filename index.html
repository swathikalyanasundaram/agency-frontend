\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foci Studio — Design that means business.</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100vh;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .central-content {
      position: absolute;
      text-align: center;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .main-title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    .contact-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 0.55rem 1.3rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: background 0.2s ease, border-color 0.2s ease;
      text-decoration: none;
    }

    .contact-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .orbit-stage {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: rotateOrbit 40s linear infinite;
    }

    .orbit-stage:hover {
      animation-play-state: paused;
    }

    .card {
      position: absolute;
      width: 130px;
      height: 130px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      animation: counterRotate 40s linear infinite;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Fixed individual transforms using correct matrix order: translate then rotate */
    .card:nth-child(1) { transform: translate(420px, 0px); }
    .card:nth-child(2) { transform: translate(296px, 296px); }
    .card:nth-child(3) { transform: translate(0px, 420px); }
    .card:nth-child(4) { transform: translate(-296px, 296px); }
    .card:nth-child(5) { transform: translate(-420px, 0px); }
    .card:nth-child(6) { transform: translate(-296px, -296px); }
    .card:nth-child(7) { transform: translate(0px, -420px); }
    .card:nth-child(8) { transform: translate(296px, -296px); }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes counterRotate {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @media (max-width: 1024px) {
      .card { width: 100px; height: 100px; }
      .card:nth-child(1) { transform: translate(250px, 0px); }
      .card:nth-child(2) { transform: translate(176px, 176px); }
      .card:nth-child(3) { transform: translate(0px, 250px); }
      .card:nth-child(4) { transform: translate(-176px, 176px); }
      .card:nth-child(5) { transform: translate(-250px, 0px); }
      .card:nth-child(6) { transform: translate(-176px, -176px); }
      .card:nth-child(7) { transform: translate(0px, -250px); }
      .card:nth-child(8) { transform: translate(176px, -176px); }
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <div class="orbit-stage">
      <div class="card"><img src="https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?auto=format&fit=crop&w=400&q=80" alt="Work 1"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&w=400&q=80" alt="Work 2"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80" alt="Work 3"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=400&q=80" alt="Work 4"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=400&q=80" alt="Work 5"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80" alt="Work 6"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=400&q=80" alt="Work 7"></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=400&q=80" alt="Work 8"></div>
    </div>

    <div class="central-content">
      <h1 class="main-title">Design. Develop. Grow.</h1>
      <p class="subtitle">Foci Studio - Design that means business.</p>
      <a href="#contact" class="contact-btn">Get in touch</a>
    </div>
  </div>

</body>
</html>
