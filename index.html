<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yezhuththu.site — Web Engineering Studio, Chennai</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-primary: #0a0a0c;
      --text-main: #f4f4f6;
      --accent: #e8a23c;
      --muted: rgba(244, 244, 246, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Super Graphics: Ambient Background Orbs */
    .graphic-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      pointer-events: none;
      z-index: 1;
    }
    .orb-1 {
      width: 45vw;
      height: 45vw;
      background: linear-gradient(135deg, #e8a23c, #c97b22);
      top: -15%;
      right: -10%;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-2 {
      width: 35vw;
      height: 35vw;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      bottom: -10%;
      left: -5%;
      animation: floatOrb 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px); }
    }

    /* Hero Layout */
    .motion-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 4rem 2rem;
      z-index: 2;
    }

    .hero-container {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 4rem;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(10px);
    }

    .motion-hero h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2.8rem, 5vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin-bottom: 1.2rem;
    }

    .motion-hero p {
      font-size: 1.15rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 2rem;
      max-width: 44ch;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      background: #f4f4f6;
      color: #0a0a0c;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: #ffffff;
    }

    /* Graphic Card Element */
    .hero-graphic-card {
      width: 100%;
      height: 420px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    .card-inner {
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    /* Responsive Design */
    @media (max-width: 868px) {
      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .motion-hero p {
        margin-left: auto;
        margin-right: auto;
      }
      .hero-graphic-card {
        height: 320px;
      }
    }
  </style>
</head>
<body>

  <section class="motion-hero">
    <!-- Super Graphic Background Elements -->
    <div class="graphic-orb orb-1"></div>
    <div class="graphic-orb orb-2"></div>

    <div class="hero-container">
      <div class="hero-content">
        <span class="badge">Web Engineering Studio</span>
        <h1>Crafting digital motion &amp; code.</h1>
        <p>We transform static concepts into fluid, high-performance web experiences with meticulous engineering.</p>
        <div class="cta-row">
          <a href="#contact" class="btn-primary">Start a project</a>
        </div>
      </div>

      <div class="hero-graphic-card">
        <div class="card-inner">Interactive Motion Canvas</div>
      </div>
    </div>
  </section>

  <!-- Motion Orchestration Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      gsap.from(".badge", { y: 20, opacity: 0, duration: 0.8, ease: "power3.out" });
      gsap.from(".motion-hero h1", { y: 30, opacity: 0, duration: 1, delay: 0.1, ease: "power3.out" });
      gsap.from(".motion-hero p", { y: 30, opacity: 0, duration: 1, delay: 0.2, ease: "power3.out" });
      gsap.from(".cta-row", { y: 20, opacity: 0, duration: 1, delay: 0.3, ease: "power3.out" });
      gsap.from(".hero-graphic-card", { scale: 0.95, opacity: 0, duration: 1.2, delay: 0.2, ease: "power3.out" });
    });
  </script>

</body>
</html>
