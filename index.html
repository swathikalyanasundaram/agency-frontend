<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet Clover — an interactive hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,380;9..144,460;9..144,560&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:      #FFF8EC;
    --gold-100:   #F6C86B;
    --gold-300:   #E8A23C;
    --gold-500:   #C97B22;
    --umber-700:  #6B3A12;
    --umber-900:  #3B220C;
    --ink:        #2A1808;
    --ink-soft:   rgba(42,24,8,0.62);

    --frame-w: 280;
    --frame-h: 468;
    --char-w: clamp(220px, 26vw, 380px);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:var(--cream);
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--ink);
  }

  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    align-items:center;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 68% 62%, #F2B94E 0%, #E39A34 32%, #C97B22 58%, #8C4B14 82%, #5B2C0A 100%);
    isolation:isolate;
  }

  /* soft drifting wool-light accents, purely decorative, very slow */
  .glow{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    pointer-events:none;
    z-index:0;
  }
  .glow--a{
    width:38vw; height:38vw;
    top:-10%; left:-6%;
    background:radial-gradient(circle, #FFDFA0 0%, transparent 70%);
    animation:drift1 26s ease-in-out infinite;
  }
  .glow--b{
    width:26vw; height:26vw;
    bottom:-8%; right:6%;
    background:radial-gradient(circle, #FFC77A 0%, transparent 70%);
    animation:drift2 32s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(3vw, 4vw); }
  }
  @keyframes drift2{
    0%,100%{ transform:translate(0,0); }
    50%{ transform:translate(-3vw, -3vw); }
  }

  .hero__inner{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1240px;
    margin:0 auto;
    padding: clamp(28px, 6vw, 72px) clamp(24px, 6vw, 64px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:clamp(24px, 5vw, 64px);
  }

  .copy{
    flex: 1 1 420px;
    max-width: 480px;
  }

  .copy h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:560;
    font-size: clamp(2.6rem, 5vw, 4rem);
    line-height:1.02;
    letter-spacing:-0.01em;
    margin:0 0 0.42em;
    color:var(--cream);
  }

  .copy p{
    font-size: clamp(1rem, 1.15vw, 1.15rem);
    line-height:1.55;
    color: rgba(255,248,236,0.86);
    margin:0 0 1.6em;
    max-width: 40ch;
  }

  .meta-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .hint-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:9px 16px 9px 12px;
    border-radius:999px;
    background:rgba(59,34,12,0.28);
    border:1px solid rgba(255,248,236,0.28);
    backdrop-filter:blur(6px);
    color:var(--cream);
    font-size:0.86rem;
    font-weight:500;
    letter-spacing:0.01em;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }

  .hint-chip.is-hidden{
    opacity:0;
    transform:translateY(4px);
  }

  .hint-chip svg{ display:block; flex-shrink:0; }

  .cursor-dot{
    animation: pulse 1.8s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.72); }
  }

  /* ---- character stage ---- */
  .stage{
    position:relative;
    flex: 0 0 auto;
    width:100%;
    max-width: 460px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    height: clamp(300px, 62vh, 640px);
  }

  .stage__shadow{
    position:absolute;
    bottom: 4%;
    left:50%;
    width: 62%;
    height: 26px;
    transform:translateX(-50%);
    background: radial-gradient(ellipse, rgba(30,16,4,0.45) 0%, rgba(30,16,4,0) 72%);
    filter:blur(2px);
    z-index:1;
  }

  .char{
    position:relative;
    z-index:2;
    width: var(--char-w);
    aspect-ratio: var(--frame-w) / var(--frame-h);
    overflow:hidden;
    transform: translateZ(0);
    will-change: transform;
    -webkit-mask-image: radial-gradient(ellipse 58% 66% at 50% 38%, black 0%, black 32%, rgba(0,0,0,0.7) 55%, transparent 88%);
            mask-image: radial-gradient(ellipse 58% 66% at 50% 38%, black 0%, black 32%, rgba(0,0,0,0.7) 55%, transparent 88%);
    -webkit-mask-repeat:no-repeat;
            mask-repeat:no-repeat;
    -webkit-mask-size:100% 100%;
            mask-size:100% 100%;
  }

  .char img{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    width:auto;
    max-width:none;
    display:block;
    will-change:transform;
  }

  .char__ring{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    border-radius:50%;
  }

  footer{
    position:absolute;
    left:0; right:0; bottom:14px;
    z-index:1;
    text-align:center;
    font-size:0.78rem;
    color:rgba(255,248,236,0.55);
    letter-spacing:0.01em;
  }
  footer a{ color:inherit; }

  /* ---- layout: stack on narrow screens ---- */
  @media (max-width: 860px){
    .hero__inner{
      flex-direction:column;
      text-align:center;
      padding-top: clamp(48px, 10vh, 90px);
      padding-bottom: clamp(24px, 8vh, 60px);
    }
    .copy{ flex: 0 0 auto; max-width:520px; }
    .copy p{ margin-left:auto; margin-right:auto; }
    .meta-row{ justify-content:center; }
    .stage{ flex: 0 0 auto; max-width:340px; height: clamp(220px, 40vh, 380px); margin-top: clamp(8px, 3vh, 28px); }
    :root{ --char-w: clamp(190px, 52vw, 300px); }
  }

  @media (prefers-reduced-motion: reduce){
    .glow--a, .glow--b{ animation:none; }
    .hint-chip{ transition:none; }
    .cursor-dot{ animation:none; }
  }
</style>
</head>
<body>

<section class="hero" id="hero">
  <div class="glow glow--a"></div>
  <div class="glow glow--b"></div>

  <div class="hero__inner">
    <div class="copy">
      <h1>Meet Clover.</h1>
      <p>A woolly little character built from 96 hand-picked frames. Move your cursor across the page and watch him follow, ease, and settle back home the moment you look away.</p>
      <div class="meta-row">
        <span class="hint-chip" id="hintChip">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle class="cursor-dot" cx="7" cy="7" r="5" fill="#FFF8EC"/>
          </svg>
          Move your cursor
        </span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="stage__shadow"></div>
      <div class="char" id="char">
        <img id="charImg" src="sheep_spritesheet.jpg" alt="Clover, an animated wool character, turning his head to follow the cursor" draggable="false">
      </div>
    </div>
  </div>

  <footer>Frame-based cursor tracking &middot; 96 frames &middot; vanilla JS</footer>
</section>

<script>
(function(){
  "use strict";

  var FRAME_COUNT = 96;
  var CENTER_FRAME = Math.floor(FRAME_COUNT / 2); // Frame 48 (Straight ahead)

  var hero   = document.getElementById('hero');
  var stage  = document.getElementById('stage');
  var charEl = document.getElementById('char');
  var img    = document.getElementById('charImg');
  var hint   = document.getElementById('hintChip');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function layoutImage(){
    var displayW = charEl.offsetWidth;
    img.style.width = (displayW * FRAME_COUNT) + 'px';
    img.style.height = 'auto';
    return displayW;
  }

  var displayWidth = layoutImage();

  var current = CENTER_FRAME; 
  var target  = CENTER_FRAME; 
  var isActive = false;       
  var hintDismissed = false;
  var raf = null;

  var lastClientX = 0;
  var lastClientY = 0;

  var EASE = 0.12;            
  var IDLE_EASE = 0.06;       

  function frameForPointer(clientX, clientY){
    var stageRect = stage.getBoundingClientRect();
    
    // Sheep's stomach / center body anchor point
    var bodyCenterX = stageRect.left + (stageRect.width / 2);
    var bodyCenterY = stageRect.top + (stageRect.height * 0.55);

    // --- HORIZONTAL TRACKING (Left / Right) ---
    var distanceX = clientX - bodyCenterX;
    var maxRangeX = window.innerWidth * 0.38;
    var normalizedX = Math.min(1, Math.max(-1, distanceX / maxRangeX));
    var baseFrame = CENTER_FRAME + (normalizedX * CENTER_FRAME);

    // --- VERTICAL FRAME NUDGE (Up / Down) ---
    var distanceY = clientY - bodyCenterY;
    var maxRangeY = window.innerHeight * 0.35;
    var normalizedY = Math.min(1, Math.max(-1, distanceY / maxRangeY));
    
    var finalFrame = baseFrame + (normalizedY * 4);

    return Math.min(FRAME_COUNT - 1, Math.max(0, finalFrame));
  }

  function onPointerMove(e){
    if (reduceMotion) return;
    lastClientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    lastClientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    
    target = frameForPointer(lastClientX, lastClientY);
    isActive = true;
    if (!hintDismissed){
      hintDismissed = true;
      hint.classList.add('is-hidden');
    }
    start();
  }

  function onPointerLeave(){
    isActive = false;
    target = CENTER_FRAME;
    start();
  }

  function render(now){
    var breathing = 0;
    if (!isActive){
      breathing = Math.sin(now * 0.0012) * 0.5;
    }

    var ease = isActive ? EASE : IDLE_EASE;
    var goal = target + (isActive ? 0 : breathing);
    current += (goal - current) * ease;

    var rounded = Math.round(current);
    rounded = Math.min(FRAME_COUNT - 1, Math.max(0, rounded));
    
    var offsetX = Math.round(-rounded * displayWidth);
    
    // Stomach-anchored organic vertical translation matching cursor height
    var stageRect = stage.getBoundingClientRect();
    var bodyCenterY = stageRect.top + (stageRect.height * 0.55);
    var offsetY = isActive ? (lastClientY - bodyCenterY) : 0;
    var verticalTranslate = Math.min(12, Math.max(-12, offsetY * 0.08));

    img.style.transform = 'translate3d(' + offsetX + 'px, ' + verticalTranslate + 'px, 0)';

    var settled = Math.abs(goal - current) < 0.02;
    if (!settled || isActive){
      raf = requestAnimationFrame(render);
    } else {
      raf = null; 
    }
  }

  function start(){
    if (raf == null){
      raf = requestAnimationFrame(render);
    }
  }

  function paintIdle(){
    var offsetX = Math.round(-CENTER_FRAME * displayWidth);
    img.style.transform = 'translate3d(' + offsetX + 'px, 0, 0)';
  }

  if (img.complete){
    paintIdle();
  } else {
    img.addEventListener('load', function(){
      displayWidth = layoutImage();
      paintIdle();
    });
  }

  if (!reduceMotion){
    window.addEventListener('mousemove', onPointerMove, { passive:true });
    window.addEventListener('touchmove', onPointerMove, { passive:true });
    hero.addEventListener('mouseleave', onPointerLeave);
    window.addEventListener('touchend', onPointerLeave, { passive:true });
    window.addEventListener('blur', onPointerLeave);
  } else {
    hint.classList.add('is-hidden');
  }

  var resizeT = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeT);
    resizeT = setTimeout(function(){
      displayWidth = layoutImage();
      paintIdle();
    }, 120);
  });

})();
</script>

</body>
</html>
