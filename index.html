<script>
    const cursor = document.querySelector('.cursor'),
          label = document.querySelector('.cursor-label'),
          slothStage = document.getElementById('slothStage'),
          slothSprite = document.getElementById('slothSprite');
          
    // Sloth sprite frames array with correct filenames
    const slothFrames = ['cartoon-sloth-1.png', 'cartoon-sloth-2.png', 'cartoon-sloth-3.png', 'cartoon-sloth-4.png', 'cartoon-sloth-5.png'];
    let currentFrame = 0;
    let walkTimer;
    let lastMove = 0;

    window.addEventListener('mousemove', e => {
      // 1. Move Custom Cursor
      cursor.style.transform = `translate(${e.clientX-10}px,${e.clientY-10}px)`;
      label.style.transform = `translate(${e.clientX+14}px,${e.clientY+10}px)`;
      
      const x = e.clientX / innerWidth - .5;
      const y = e.clientY / innerHeight - .5;
      
      // 2. Parallax stage shift towards cursor
      slothStage.style.transform = `translate(${x * -12}px, ${y * -6}px)`;

      // 3. Proximity check for "curious" speech bubble state
      const r = slothStage.getBoundingClientRect();
      const slothCenterX = r.left + r.width * .5;
      const slothCenterY = r.top + r.height * .5;
      const d = Math.hypot(e.clientX - slothCenterX, e.clientY - slothCenterY);
      
      if (d < Math.min(300, r.width * 1.3)) {
        slothStage.classList.add('curious');
      } else {
        slothStage.classList.remove('curious');
      }

      // 4. Throttled frame animation sequence so it walks smoothly
      const now = Date.now();
      if (now - lastMove > 140) { 
        currentFrame = (currentFrame + 1) % slothFrames.length;
        slothSprite.src = slothFrames[currentFrame];
        lastMove = now;
      }

      // Stop walking and reset back to idle frame when mouse stops moving
      clearTimeout(walkTimer);
      walkTimer = setTimeout(() => {
        currentFrame = 0;
        slothSprite.src = slothFrames[0];
      }, 200);
    });

    document.querySelectorAll('a,button,.step,input,select,textarea').forEach(el=>{
      el.addEventListener('mouseenter',()=>document.body.classList.add('hovering'));
      el.addEventListener('mouseleave',()=>document.body.classList.remove('hovering'));
    });

    const form = document.getElementById('contactForm');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const payload = {
        clientname: document.getElementById('clientname').value.trim(),
        email: document.getElementById('email').value.trim(),
        serviceType: document.getElementById('serviceType').value,
        estimatedBudget: Number(document.getElementById('estimatedBudget').value),
        projectDetails: document.getElementById('projectDetails').value.trim()
      };
      const btn = form.querySelector('button');
      const old = btn.innerHTML;
      btn.innerHTML = 'Sending your signal…';
      btn.disabled = true;
      try {
        const r = await fetch('https://agency-backend-t8oq.onrender.com/api/leads', {
          method: 'POST',
          mode: 'cors',
          headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
          body: JSON.stringify(payload)
        });
        if (r.ok || r.status === 200 || r.status === 201) {
          form.innerHTML = '<div style="padding:34px 4px;text-align:center"><div style="font-size:42px;color:#ed7445">✦</div><h3 style="font-family:Playfair Display,serif;font-size:28px">Signal received.</h3><p style="color:#6f786e;margin-top:8px">We’ll be in touch soon.</p></div>';
        } else {
          alert('Server responded with an issue: ' + r.status);
          btn.innerHTML = old;
          btn.disabled = false;
        }
      } catch (err) {
        alert('CORS or Network error. Make sure your Render backend allows origins from yezhuththu.site');
        btn.innerHTML = old;
        btn.disabled = false;
      }
    });
  </script>
