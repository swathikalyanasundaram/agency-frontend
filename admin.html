<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | yezhuththu.site</title>
  <!-- Google Fonts & Lucide Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(18, 24, 38, 0.75);
      --bg-nav: rgba(7, 9, 14, 0.85);
      --accent-primary: #3b82f6;
      --accent-glow: #60a5fa;
      --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(59, 130, 246, 0.4);
      --glow-color: rgba(59, 130, 246, 0.12);
      --input-bg: rgba(15, 23, 42, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 6%;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.12) 0px, transparent 50%);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    .brand-logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }

    .brand-logo span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(59, 130, 246, 0.5);
    }

    .btn-outline {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    .btn-outline:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Metrics Cards Grid */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .metric-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
    }

    .metric-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .metric-card h2 {
      font-size: 2.2rem;
      color: var(--text-main);
      margin-top: 8px;
      font-weight: 800;
    }

    /* Controls & Search */
    .controls {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      align-items: center;
    }

    .search-input {
      width: 100%;
      max-width: 380px;
      padding: 12px 18px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
    }

    /* Data Table */
    .table-container {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(59, 130, 246, 0.04);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent-glow);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-title">
        <a href="index.html" class="brand-logo">yezhuththu<span>.site</span></a>
        <h1 style="margin-top: 10px;">Lead Management Dashboard</h1>
        <p>Monitor client inquiries, budget pipeline, and incoming project requests in real-time.</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="loadLeads()">
          <i data-lucide="refresh-cw"></i> Refresh Data
        </button>
        <button class="btn btn-outline" onclick="logout()">
          <i data-lucide="log-out"></i> Logout
        </button>
      </div>
    </div>

    <!-- Metrics Cards -->
    <div class="metrics">
      <div class="metric-card">
        <p>Total Leads</p>
        <h2 id="totalLeads">0</h2>
      </div>
      <div class="metric-card">
        <p>Total Pipeline Value</p>
        <h2 id="totalValue">₹0</h2>
      </div>
      <div class="metric-card">
        <p>Average Budget</p>
        <h2 id="avgBudget">₹0</h2>
      </div>
    </div>

    <!-- Search Control -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, email, or service..." onkeyup="filterLeads()" />
    </div>

    <!-- Data Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Client Name</th>
            <th>Email</th>
            <th>Service Requested</th>
            <th>Estimated Budget</th>
            <th>Date Received</th>
          </tr>
        </thead>
        <tbody id="leadTableBody">
          <tr><td colspan="6" class="empty-state">Authenticating secure session...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    let rawLeads = [];
    let authHeader = localStorage.getItem('adminAuth');

    async function loadLeads() {
      while (!authHeader) {
        const username = prompt("Enter Admin Username:");
        const password = prompt("Enter Admin Password:");
        if (username && password) {
          authHeader = 'Basic ' + btoa(username + ':' + password);
        } else {
          alert('Access denied. Redirecting to home page.');
          window.location.href = 'index.html';
          return;
        }
      }

      try {
        const response = await fetch('https://agency-backend-t8oq.onrender.com/api/leads', {
          headers: { 'Authorization': authHeader }
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('adminAuth');
          authHeader = null;
          alert('Invalid Username or Password! Please try again.');
          return loadLeads();
        }

        localStorage.setItem('adminAuth', authHeader);
        rawLeads = await response.json();
        renderMetrics(rawLeads);
        renderTable(rawLeads);
      } catch (err) {
        console.error('Fetch Error:', err);
        document.getElementById('leadTableBody').innerHTML = `
          <tr><td colspan="6" class="empty-state" style="color: #ef4444;">Failed to connect to backend server.</td></tr>
        `;
      }
    }

    function renderMetrics(leads) {
      document.getElementById('totalLeads').innerText = leads.length;
      const totalSum = leads.reduce((acc, lead) => acc + Number(lead.estimatedBudget || lead.budget || 0), 0);
      const avg = leads.length > 0 ? (totalSum / leads.length) : 0;
      document.getElementById('totalValue').innerText = '₹' + totalSum.toLocaleString('en-IN');
      document.getElementById('avgBudget').innerText = '₹' + Math.round(avg).toLocaleString('en-IN');
    }

    function renderTable(leads) {
      const tbody = document.getElementById('leadTableBody');
      tbody.innerHTML = '';
      if (leads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No lead records found.</td></tr>';
        return;
      }
      leads.forEach(lead => {
        const clientName = lead.clientname || lead.clientName || lead.name || 'N/A';
        const service = lead.serviceType || lead.service || 'N/A';
        const budget = lead.estimatedBudget || lead.budget || 0;
        const date = lead.createdAt ? new Date(lead.createdAt).toLocaleString() : 'N/A';
        tbody.innerHTML += `
          <tr>
            <td><strong>#${lead.id}</strong></td>
            <td>${clientName}</td>
            <td><a href="mailto:${lead.email}" style="color: var(--accent-glow); text-decoration: none;">${lead.email}</a></td>
            <td><span class="badge">${service}</span></td>
            <td><strong>₹${Number(budget).toLocaleString('en-IN')}</strong></td>
            <td>${date}</td>
          </tr>
        `;
      });
    }

    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = rawLeads.filter(lead => {
        const name = (lead.clientname || lead.clientName || lead.name || '').toLowerCase();
        const email = (lead.email || '').toLowerCase();
        const service = (lead.serviceType || lead.service || '').toLowerCase();
        return name.includes(query) || email.includes(query) || service.includes(query);
      });
      renderTable(filtered);
    }

    function logout() {
      localStorage.removeItem('adminAuth');
      authHeader = null;
      alert('Logged out successfully.');
      window.location.href = 'index.html';
    }

    // Initialize on page load
    loadLeads();
  </script>
</body>
</html>
