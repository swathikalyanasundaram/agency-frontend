<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | yezhuththu.site</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root[data-theme="dark"] {
      --bg-dark: #020617;
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-nav: rgba(2, 6, 23, 0.85);
      --accent-primary: #6366f1;
      --accent-glow: #818cf8;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
      --border-hover: rgba(99, 102, 241, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding: 40px 6%;
      min-height: 100vh;
    }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 24px;
    }
    .admin-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
    .admin-header h1 span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .back-btn {
      background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.4);
      color: var(--accent-glow); padding: 10px 20px; border-radius: 99px; font-weight: 600;
      text-decoration: none; font-size: 0.9rem; transition: all 0.2s ease;
    }
    .back-btn:hover { background: rgba(99, 102, 241, 0.3); }

    /* Metrics Grid */
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .metric-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 24px; backdrop-filter: blur(20px);
    }
    .metric-card h3 { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; margin-bottom: 8px; }
    .metric-card .value { font-size: 2rem; font-weight: 700; color: var(--text-main); }

    /* Search & Controls */
    .controls-bar { margin-bottom: 24px; }
    .search-input {
      width: 100%; max-width: 400px; background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 18px;
      color: var(--text-main); font-size: 0.95rem; font-family: inherit; outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent-primary); }

    /* Table Wrapper */
    .table-container {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 24px; overflow-x: auto; backdrop-filter: blur(24px);
    }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th {
      background: rgba(2, 6, 23, 0.5); padding: 16px 20px; font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }
    td { padding: 18px 20px; font-size: 0.9rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

    @media(max-width: 768px) {
      .metrics-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="admin-header">
    <h1>Lead Management <span>Dashboard</span></h1>
    <a href="index.html" class="back-btn">&larr; Return to Site</a>
  </div>

  <!-- Key Metrics -->
  <div class="metrics-grid">
    <div class="metric-card">
      <h3>Total Leads Received</h3>
      <div class="value" id="totalleads">0</div>
    </div>
    <div class="metric-card">
      <h3>Total Pipeline Value</h3>
      <div class="value" id="totalvalue">₹0</div>
    </div>
    <div class="metric-card">
      <h3>Average Budget</h3>
      <div class="value" id="avgBudget">₹0</div>
    </div>
  </div>

  <!-- Search Filter -->
  <div class="controls-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Search leads by name, email, or service..." onkeyup="filterLeads()" />
  </div>

  <!-- Lead Data Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Client Name</th>
          <th>Email</th>
          <th>Service Requested</th>
          <th>Project Overview</th>
          <th>Estimated Budget</th>
          <th>Date Received</th>
        </tr>
      </thead>
      <tbody id="leadTableBody">
        <tr><td colspan="7" class="empty-state">Connecting to backend database...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    lucide.createIcons();
    let allLeads = [];

    async function fetchLeads() {
      const tbody = document.getElementById('leadTableBody');
      try {
        const response = await fetch('https://agency-backend-t8oq.onrender.com/api/leads', {
          headers: { 'Accept': 'application/json' }
        });
        
        if (response.ok) {
          allLeads = await response.json();
          renderTable(allLeads);
          updateMetrics(allLeads);
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color: #ef4444;">Failed to load leads from database (Status: ${response.status})</td></tr>`;
        }
      } catch (err) {
        console.error('Fetch error:', err);
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color: #ef4444;">Unable to reach backend server. Check network connection or Render instance status.</td></tr>`;
      }
    }

    function renderTable(leads) {
      const tbody = document.getElementById('leadTableBody');
      tbody.innerHTML = '';

      if (!leads || leads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No lead inquiries found in the database.</td></tr>`;
        return;
      }

      leads.forEach(lead => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>#${lead.id || 'N/A'}</td>
          <td style="font-weight: 600;">${lead.clientname || 'Unnamed'}</td>
          <td><a href="mailto:${lead.email}" style="color: var(--accent-glow); text-decoration: none;">${lead.email || 'No email'}</a></td>
          <td><span style="background: rgba(99, 102, 241, 0.15); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; color: var(--accent-glow);">${lead.serviceType || ''}</span></td>
          <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${lead.projectOverview || ''}">
            ${lead.projectOverview || '<span style="color: var(--text-muted); font-style: italic;">No overview provided</span>'}
          </td>
          <td style="font-weight: 700;">₹${lead.estimatedBudget ? lead.estimatedBudget.toLocaleString() : '0'}</td>
          <td style="color: var(--text-muted); font-size: 0.85rem;">${lead.createdAt ? new Date(lead.createdAt).toLocaleDateString() : 'Recent'}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function updateMetrics(leads) {
      const totalLeads = leads.length;
      const totalValue = leads.reduce((sum, l) => sum + (Number(l.estimatedBudget) || 0), 0);
      const avgBudget = totalLeads > 0 ? Math.round(totalValue / totalLeads) : 0;

      document.getElementById('totalleads').innerText = totalLeads;
      document.getElementById('totalvalue').innerText = '₹' + totalValue.toLocaleString();
      document.getElementById('avgBudget').innerText = '₹' + avgBudget.toLocaleString();
    }

    function filterLeads() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allLeads.filter(l => 
        (l.clientname && l.clientname.toLowerCase().includes(query)) ||
        (l.email && l.email.toLowerCase().includes(query)) ||
        (l.serviceType && l.serviceType.toLowerCase().includes(query)) ||
        (l.projectOverview && l.projectOverview.toLowerCase().includes(query))
      );
      renderTable(filtered);
    }

    // Load leads on startup
    fetchLeads();
  </script>
</body>
</html>
