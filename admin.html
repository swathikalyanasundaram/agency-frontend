<script>
  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    const submitBtn = e.target.querySelector(".submit-btn");
    submitBtn.innerText = "Sending...";
    submitBtn.disabled = true;

    // Grab values from your form fields
    const formData = {
      clientname: document.getElementById("name").value,
      email: document.getElementById("email").value,
      serviceType: "Landing Page Motion", // or map this to a dropdown if you have one
      projectDetails: document.getElementById("msg").value,
      estimatedBudget: 1200 // or capture from a budget input field
    };

    try {
      const response = await fetch('https://agency-backend-t8oq.onrender.com/api/leads', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(formData)
      });

      if (response.ok) {
        alert("Thank you! Your message has been sent successfully and saved to the dashboard.");
        e.target.reset();
      } else {
        alert("Something went wrong. Please try again.");
      }
    } catch (err) {
      console.error("Submission error:", err);
      alert("Unable to reach the server. Please check your connection.");
    } finally {
      submitBtn.innerText = "Send Inquiry ✨";
      submitBtn.disabled = false;
    }
  });
</script>
