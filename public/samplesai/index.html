<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="/samplesai/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Portfolio</title>
<meta name="description" content="Portrait, wedding and editorial photography portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero-section" id="top">
  <div class="video-container"><video id="heroVideo" muted playsinline aria-label="Showreel"></video><div id="slides"></div><div class="overlay"></div><div class="flash" id="flash"></div></div>
  <div class="vf" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <nav class="navbar">
    <a class="logo" href="#top"><i class="ph ph-aperture"></i><span id="brand"></span></a>
    <div class="nav-links"><a href="#work">Work</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a></div>
    <div class="nav-actions"><a class="btn outline" href="#contact">Book a session</a></div>
    <button class="mobile-menu-toggle" id="menuBtn" aria-label="Open menu"><i class="ph ph-list"></i></button>
  </nav>
  <div class="hero-content"><div class="wrap">
    <p class="greeting animate-fade-up" id="greeting" style="animation-delay:.1s"></p>
    <h1 class="main-title animate-fade-up" id="title" style="animation-delay:.2s"></h1>
    <h2 class="sub-title accent-text-gradient animate-fade-up" id="subtitle" style="animation-delay:.3s"></h2>
    <p class="desc animate-fade-up" id="desc" style="animation-delay:.4s"></p>
    <div class="cta-group animate-fade-up" style="animation-delay:.5s"><a class="btn primary" href="#work">View portfolio</a><a class="btn outline" href="#contact">Book a session</a></div>
  </div></div>
  <div class="hero-footer">
    <div class="footer-left"><div class="socials" id="socials"></div><div class="stats-group" id="stats"></div></div>
    <div class="glass card"><div class="row"><span class="pulse-dot"></span><b id="avStatus"></b></div><p class="av-line" id="avLine"></p><p class="muted small" id="avNote"></p><a href="#contact" class="small link">Check availability</a></div>
  </div>
  <div class="exif" id="exif"></div>
  <div class="scroll-indicator"><div class="mouse"><div class="wheel"></div></div><span>Scroll to explore</span></div>
</header>
<div class="drawer" id="drawer"><button id="closeBtn" aria-label="Close menu"><i class="ph ph-x"></i></button><a href="#work">Work</a><a href="#about">About</a><a href="#services">Services</a><a href="#contact">Contact</a></div>

<section id="work" class="sec"><h2 class="h2">Selected work</h2><div class="filters" id="filters"></div><div class="masonry" id="gallery"></div></section>
<section id="about" class="sec about"><img id="aboutImg" alt="Portrait of the photographer" loading="lazy"><div><h2 class="h2" id="aboutTitle"></h2><p class="lead" id="aboutText"></p></div></section>
<section id="services" class="sec"><h2 class="h2">Services</h2><div class="cards" id="services"></div></section>
<section class="sec quotes"><div class="cards" id="quotes"></div></section>
<section id="contact" class="sec contact">
  <div><h2 class="h2">Tell me about your day</h2><p class="lead">Dates, place, and the mood you want. I reply within 24 hours.</p><p class="muted" id="contactInfo"></p></div>
  <form id="form"><input name="name" placeholder="Your name" required><input name="email" type="email" placeholder="Email" required>
    <select name="type"><option>Portrait session</option><option>Wedding / event</option><option>Editorial / commercial</option></select>
    <input name="date" placeholder="Preferred date / location"><textarea name="message" rows="4" placeholder="Message" required></textarea>
    <input name="website" class="hp" tabindex="-1" autocomplete="off"><button class="btn primary" type="submit">Send inquiry</button><p id="formMsg" class="small" role="status"></p></form>
</section>
<footer><span id="foot"></span><a href="admin/">Admin</a></footer>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" hidden><button id="lbClose" aria-label="Close">&times;</button><button id="lbPrev" aria-label="Previous">&#8249;</button><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button id="lbNext" aria-label="Next">&#8250;</button></div>
<script src="app.js"></script>
</body>
</html>
