<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><base href="/samplesai/"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fine-Art Photography</title><meta name="description" content="Fine-art portrait, wedding and editorial photography.">
<link rel="canonical" href="https://yezhuththu.site/samplesai/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="loader"><span id="ldBrand"></span><div class="ld-line"><i id="ldBar"></i></div><b id="ldNum">0</b></div>
<div class="grain" aria-hidden="true"></div><div id="cur"></div>
<header id="hdr"><a href="#top" id="brand" data-go></a><nav><a href="#work" data-go>Work</a><a href="#about" data-go>About</a><a href="#contact" data-go>Contact</a></nav></header>

<main id="top">
<section class="hero"><div class="hero-media"><video id="vid" muted playsinline autoplay loop preload="auto" aria-hidden="true"></video></div><div class="hero-shade"></div>
  <div class="hero-text"><p class="eyebrow" id="hEyebrow"></p><h1 id="hTitle" aria-label=""></h1><p class="sub" id="hSub"></p></div>
  <div class="hero-foot"><span id="hLoc"></span><span class="scroll"><i></i>Scroll</span></div></section>

<section class="intro"><p id="introText"></p></section>

<section id="work" class="hgal"><div class="hg-head"><span>Selected work</span><span id="hgCount">01 / 08</span></div><div class="hg-track" id="track"></div><div class="hg-bar"><i id="hgBar"></i></div></section>

<section id="series" class="series"></section>

<section id="about" class="about"><div class="about-img"><img id="aboutImg" alt="Portrait of the photographer"></div>
  <div class="about-txt"><p class="eyebrow">About</p><h2 id="aboutTitle"></h2><p class="lead" id="aboutText"></p><div class="stats" id="stats"></div></div></section>

<section class="services"><p class="eyebrow">Services</p><div id="svc"></div></section>

<section class="quote"><blockquote id="qText"></blockquote><p id="qWho"></p></section>

<section id="contact" class="contact"><p class="eyebrow">Contact</p><h2>Let's make something timeless.</h2>
  <a class="big" id="cMail" href="#"></a><div class="c-row"><a id="cTel" href="#"></a><a id="cIg" target="_blank" rel="noopener">Instagram</a><span id="cCity"></span></div>
  <div class="marquee" aria-hidden="true"><div id="mq"></div></div></section>
</main>
<footer><span id="foot"></span><span>Images are protected by copyright.</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="app.js"></script>
</body></html>
